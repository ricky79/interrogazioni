<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Interrogazioni programmate{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}" class="logo">📚 Interrogazioni</a>
    <a href="{{ url_for('nuova_materia') }}" class="btn">+ Nuova materia</a>
  </header>
  <main>
    {% for categoria, msg in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ categoria }}">{{ msg }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
